[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simvi"
version = "0.1.2+scvi15"
description = "Spatial Interaction Modeling using Variational Inference"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Mingze Dong", email = "mingze.dong@yale.edu" }]
requires-python = ">=3.11"
dependencies = [
    "anndata",
    "numpy",
    "pandas",
    "scanpy",
    "scikit-learn",
    "scipy",
    "scvi-tools>=1.5",
    "statsmodels",
    "torch",
    "torch-geometric",
    "tqdm",
]

[project.optional-dependencies]
# Archetypal analysis in `get_archetypes` / `get_se`.
archetypes = ["py-pcha"]

[project.urls]
Source = "https://github.com/KlugerLab/SIMVI"

[tool.hatch.build.targets.wheel]
packages = ["simvi"]
